<div class="table-wrap" id="tableArea"><table id="plans"><colgroup><col style="width:40px"><col style="width:83px"><col style="width:147px"><col style="width:85px"><col style="width:103px"><col style="width:137px"><col style="width:148px"><col style="width:148px"><col style="width:148px"><col style="width:129px"><col style="width:87px"><col style="width:215px"></colgroup><thead><tr><th class="fixed-left"><input id="selectAll" type="checkbox" aria-label="选择当前页可调整的计划" onchange="selectAllRows(this.checked)"></th><th>计划顺序</th><th>生产订单号</th><th>订单数量</th><th>资源 / 线体</th><th>所属工位</th><th><button class="table-sort" id="sortTime" title="仅改变查看顺序，不影响生产排程">计划开始时间 ↕</button></th><th>计划完成时间</th><th>预计配送触发</th><th>当前物流状态</th><th>运输任务</th><th class="fixed-right">操作</th></tr></thead><tbody id="rows"></tbody></table><div id="blank" class="blank" hidden></div></div>
<footer class="table-foot"><div class="row"><span id="totalFoot">共 8 条</span><span class="muted">‹</span><span class="page">1</span><span class="muted">›</span><select aria-label="每页条数"><option>20 条/页</option><option>50 条/页</option><option>100 条/页</option></select></div></footer></section></main></div></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><div><h2 id="dialogTitle"></h2><div class="subtitle" id="dialogSubtitle"></div></div><button class="close" aria-label="关闭" onclick="closeDialog()">×</button></div><div class="dialog-body" id="dialogBody"></div><div class="dialog-foot" id="dialogFoot"></div></dialog><div class="toast" id="toast" role="status" hidden></div>
<script src="prototype.js"></script>
